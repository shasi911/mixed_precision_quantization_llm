[project]
name = "quant-llm"
version = "0.1.0"
description = "Layer-Aware Quantization for Efficient LLM Inference"
requires-python = ">=3.10"
dependencies = [
    "torch>=2.1.0",
    "transformers>=4.40.0",
    "bitsandbytes>=0.43.0",
    "accelerate>=0.27.0",
    "datasets>=2.18.0",
    "pyyaml>=6.0",
    "numpy>=1.24.0",
    "tqdm>=4.66.0",
    "sentencepiece>=0.1.99",
    "protobuf>=3.20.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]

[tool.uv]
# PyTorch ships different wheels per CUDA version.
# Override the index URL to match your GPU's CUDA version.
# Common options:
#   CUDA 12.1 : https://download.pytorch.org/whl/cu121
#   CUDA 12.4 : https://download.pytorch.org/whl/cu124
#   CPU only  : https://download.pytorch.org/whl/cpu
index-url = "https://download.pytorch.org/whl/cu121"
extra-index-url = ["https://pypi.org/simple"]
